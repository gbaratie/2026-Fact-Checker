[project]
name = "fact-checker-backend"
version = "0.1.0"
description = "API et pipelines de collecte pour le fact-checker présidentielle 2026"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "youtube-transcript-api>=0.6.2",
    "trafilatura>=2.0.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "python-dateutil>=2.9.0",
    "unidecode>=1.3.8",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
