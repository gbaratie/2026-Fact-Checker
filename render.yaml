services:
  - type: web
    name: fact-checker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: INGESTION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
